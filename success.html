<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido confirmado — Sportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="logo"><span class="logo-mark">S</span>Sportiva</a>
    <nav class="nav-links" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="products.html">Produtos</a>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="icon-btn" aria-label="Carrinho de compras">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>

    <div class="success-icon">✓</div>

</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0;">
      <span>© 2026 Sportiva. Todos os direitos reservados.</span>
      <span>Projeto de portfólio Front-End</span>
    </div>
  </div>
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script src="app.js"></script>

</html>
